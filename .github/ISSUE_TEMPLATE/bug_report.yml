name: Bug Report
description: Report a bug or unexpected behavior in Parzival Oversight Agent
title: "[Bug]: "
labels: ["type: bug", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the information below to help us diagnose and fix the issue.

  - type: input
    id: version
    attributes:
      label: Parzival Oversight Agent Version
      description: Run `git describe --tags` in the pov-oversight-agent directory
      placeholder: "v1.2.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System & Platform
      description: What OS and platform are you running?
      placeholder: "Ubuntu 22.04 LTS (WSL2 on Windows 11)"
    validations:
      required: true

  - type: input
    id: claude-code-version
    attributes:
      label: Claude Code Version
      description: Run `claude --version` or check the Claude Code extension version
      placeholder: "Claude Code 1.x.x"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is
      placeholder: "When I run install.sh, the template copy step fails with..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Clone the repository
        2. Run `./install.sh`
        3. Run `/pov:commands:parzival-start`
        4. Observe error in output
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: "Parzival should initialize oversight documents and display session status"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: "install.sh exits with an error and templates are not copied to the target project"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: |
        Paste any relevant log output from:
        - Installation scripts (install.sh, init-oversight.sh)
        - Claude Code command output
        - Shell error messages
      placeholder: |
        [ERROR] Failed to copy templates to target directory
        ...
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here (shell type, file permissions, project structure, etc.)
      placeholder: "This started happening after updating to the latest version. I'm using zsh on macOS."

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      description: Please verify you've completed these steps
      options:
        - label: I have searched existing issues to avoid duplicates
          required: true
        - label: I have included all relevant logs and error messages
          required: true
        - label: I am using a supported version (1.x.x)
          required: false
        - label: I have verified my shell has execute permissions on install scripts (`chmod +x install.sh`)
          required: false
